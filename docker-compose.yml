services:
  minio:
    # Community build of upstream MinIO; pin the multi-architecture digest.
    image: &minio-image ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: minio-server
    ports:
      - "${MINIO_SERVER_PORT:-9000}:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./data/minio-data:/data
    command: server /data

  setup:
    # This image also bundles mc and Bash, required by setup-console.sh.
    image: *minio-image
    container_name: minio-setup
    volumes:
      - ./setup-console.sh:/setup-console.sh
      - ./data/setup:/setup
    environment:
      MINIO_HOST: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CONSOLE_USER: console
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:-}
    entrypoint: /bin/sh
    command: -c "chmod +x /setup-console.sh && /setup-console.sh"
    depends_on:
      - minio
    restart: "no"

  console:
    image: ghcr.io/georgmangold/console
    container_name: minio-console
    ports:
      - "${MINIO_CONSOLE_PORT:-9090}:9090"
    environment:
      CONSOLE_MINIO_SERVER: http://minio:9000
    depends_on:
      - minio
      - setup
